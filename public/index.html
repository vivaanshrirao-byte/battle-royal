<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>⚔️ Battle Royal</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#0a0a0a;color:#fff;overflow:hidden}#login{position:fixed;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);z-index:100}#login.hidden{display:none}.box{background:rgba(0,0,0,0.8);padding:50px;border-radius:15px;text-align:center}h1{font-size:2.5em;margin-bottom:30px}input,select{width:100%;padding:12px;margin:10px 0;border:2px solid #667eea;border-radius:8px;background:rgba(255,255,255,0.1);color:#fff}button{width:100%;padding:15px;background:#667eea;border:none;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer;margin-top:20px}button:hover{background:#764ba2}#game{display:none;position:fixed;width:100%;height:100%;top:0;left:0;background:#000;padding:20px}#game.active{display:flex}#game.active{gap:20px}canvas{border:3px solid #4CAF50;border-radius:10px;background:#1a1a2e;flex:1;width:60%;height:100%}.panel{width:35%;display:flex;flex-direction:column;gap:15px;overflow-y:auto}.status{background:rgba(255,255,255,0.05);border:2px solid #4CAF50;padding:15px;border-radius:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.status-item{text-align:center}.status-item strong{color:#4CAF50;display:block}.status-item span{font-size:1.2em;margin-top:5px}.box-panel{background:rgba(255,255,255,0.05);border:1px solid #666;padding:15px;border-radius:8px;min-height:150px;display:flex;flex-direction:column}.box-panel h3{color:#4CAF50;margin-bottom:10px;border-bottom:1px solid #666;padding-bottom:10px}.content{flex:1;overflow-y:auto;margin-bottom:10px}.msg{padding:8px;margin:5px 0;background:rgba(100,100,100,0.2);border-left:3px solid #4CAF50;border-radius:3px;word-break:break-word}.msg strong{color:#4CAF50}.msg.sys{border-left-color:#ff9800;font-style:italic}.msg.announce{border-left-color:#f44336}.chat-input{display:flex;gap:5px}.chat-input input{flex:1;padding:8px}.chat-input select{padding:8px}.chat-input button{margin:0;padding:8px 15px;width:auto}.player{padding:8px;margin:5px 0;background:rgba(100,150,200,0.2);border-left:3px solid #4CAF50;border-radius:3px}.player.dead{opacity:0.5;border-left-color:#f44336}.end{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);padding:50px;border-radius:15px;border:3px solid #f44336;text-align:center;z-index:200;display:none}.end.show{display:block}.end h1{color:#f44336;margin-bottom:20px}.end button{max-width:200px;margin:20px auto 0}.info{background:rgba(255,255,255,0.05);border:1px solid #666;padding:12px;border-radius:8px;font-size:0.9em}.key{display:inline-block;background:#333;padding:5px 10px;margin:5px;border-radius:3px}</style></head><body><div id="login"><div class="box"><h1>⚔️ BATTLE ROYAL</h1><p>Accessible Arena</p><input type="text" id="name" placeholder="Your name" autofocus><select id="team"><option value="solo">Solo</option><option value="red">Red Team</option><option value="blue">Blue Team</option></select><button onclick="joinGame()">JOIN BATTLE</button></div></div><div id="game"><canvas id="canvas"></canvas><div class="panel"><div class="status"><div class="status-item"><strong>❤️ HP</strong><span id="hp">100/100</span></div><div class="status-item"><strong>📍 Pos</strong><span id="pos">0,0</span></div><div class="status-item"><strong>👥 Players</strong><span id="alive">0</span></div><div class="status-item"><strong>⚔️ Kills</strong><span id="kills">0</span></div></div><div class="box-panel"><h3>👥 Players</h3><div class="content" id="players"></div></div><div class="box-panel"><h3>💬 Chat</h3><div class="content" id="chat"></div><div class="chat-input"><input type="text" id="msg" placeholder="Type..."><select id="type"><option value="global">Global</option><option value="team">Team</option></select><button onclick="sendChat()">Send</button></div></div><div class="info"><span class="key">↑↓←→</span> Move | <span class="key">SPACE</span> Attack | <span class="key">T</span> Team | <span class="key">G</span> Global</div></div></div><div id="end" class="end"><h1 id="endTitle">GAME OVER</h1><p id="endMsg"></p><button onclick="location.reload()">PLAY AGAIN</button></div><script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script><script>const socket=io();const CONFIG={ARENA_SIZE:200,ATTACK_RANGE:15,MOVE_SPEED:3};let player=null;let allPlayers=new Map();let zone={center:{x:100,y:100},radius:80};let keys={};let gameActive=true;function joinGame(){const name=document.getElementById('name').value;const team=document.getElementById('team').value;if(!name)return;socket.emit('join',{name,team});document.getElementById('login').classList.add('hidden');document.getElementById('game').classList.add('active');speak(`Welcome ${name}. Battle started.`)}socket.on('playerJoined',data=>{if(!player){player={id:data.id,name:data.name,team:data.team,health:100,position:{x:100,y:100},kills:0,status:'alive'};allPlayers.set(data.id,player);}if(!allPlayers.has(data.id)){allPlayers.set(data.id,{id:data.id,name:data.name,team:data.team,health:100,position:{x:100,y:100},status:'alive'});}addMsg('SYS',`${data.name} joined (${data.total} total)`,'sys');})socket.on('move',data=>{if(allPlayers.has(data.id)){allPlayers.get(data.id).position=data.pos;allPlayers.get(data.id).health=data.health;}})socket.on('hit',data=>{addMsg('HIT',`${data.attacker} hit ${data.target} for ${data.damage}!`,'announce');speak(`${data.attacker} hit ${data.target}`);})socket.on('died',data=>{if(allPlayers.has(data.id)){allPlayers.get(data.id).status='dead';}addMsg('SYS',`${data.name} eliminated${data.killer?` by ${data.killer}`:''}!`,'sys');})socket.on('zone',data=>{zone.radius=data.radius;addMsg('SYS',`⚠️ Zone shrinking! ${data.radius.toFixed(1)}m`,'sys');})socket.on('chat',data=>{addMsg(data.name,data.msg,data.type==='team'?'team':'normal');})socket.on('speak',text=>{speak(text);addMsg('SYS',text,'sys');})socket.on('winner',data=>{gameActive=false;document.getElementById('endTitle').textContent=`${data.name} WON!`;document.getElementById('endMsg').textContent=`Kills: ${data.kills}`;document.getElementById('end').classList.add('show');speak(`${data.name} is the champion`);})window.addEventListener('keydown',e=>{keys[e.key.toUpperCase()]=true;if(e.key.toUpperCase()==='T'){document.getElementById('type').value='team';document.getElementById('msg').focus();}else if(e.key.toUpperCase()==='G'){document.getElementById('type').value='global';document.getElementById('msg').focus();}else if(e.key===' '){attackNearest();e.preventDefault();}})window.addEventListener('keyup',e=>{keys[e.key.toUpperCase()]=false;})document.getElementById('msg').addEventListener('keypress',e=>{if(e.key==='Enter')sendChat();})function updateMovement(){if(!player||player.status!=='alive')return;let dx=0,dy=0;if(keys['ARROWUP'])dy-=1;if(keys['ARROWDOWN'])dy+=1;if(keys['ARROWLEFT'])dx-=1;if(keys['ARROWRIGHT'])dx+=1;if(dx||dy)socket.emit('move',{dx,dy});}function attackNearest(){if(!player||player.status!=='alive')return;let nearest=null,dist=CONFIG.ATTACK_RANGE;allPlayers.forEach(p=>{if(p.id!==player.id&&p.status==='alive'){const d=Math.hypot(p.position.x-player.position.x,p.position.y-player.position.y);if(d<dist){nearest=p;dist=d;}}});if(nearest)socket.emit('attack',{target:nearest.id});}function sendChat(){const input=document.getElementById('msg');const type=document.getElementById('type').value;if(input.value.trim()){socket.emit('chat',{msg:input.value,type});input.value='';}}function addMsg(name,msg,type='normal'){const chat=document.getElementById('chat');const div=document.createElement('div');div.className='msg '+type;div.innerHTML=`<strong>${name}:</strong> ${msg}`;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;}function speak(text){const u=new SpeechSynthesisUtterance(text);u.rate=0.9;speechSynthesis.speak(u);}function render(){const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');if(!player)return;canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;const centerX=canvas.width/2;const centerY=canvas.height/2;const scale=Math.min(canvas.width,canvas.height)/CONFIG.ARENA_SIZE;ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#666';ctx.lineWidth=2;ctx.strokeRect(centerX-player.position.x*scale,centerY-player.position.y*scale,CONFIG.ARENA_SIZE*scale,CONFIG.ARENA_SIZE*scale);ctx.strokeStyle='rgba(76,175,80,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(centerX+(zone.center.x-player.position.x)*scale,centerY+(zone.center.y-player.position.y)*scale,zone.radius*scale,0,Math.PI*2);ctx.stroke();allPlayers.forEach(p=>{const sx=(p.position.x-player.position.x)*scale+centerX;const sy=(p.position.y-player.position.y)*scale+centerY;if(p.status==='dead')ctx.fillStyle='rgba(244,67,54,0.3)';else if(p.id===player.id)ctx.fillStyle='#4CAF50';else ctx.fillStyle=p.team==='red'?'#f44336':p.team==='blue'?'#2196F3':'#FF9800';ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(p.name.substring(0,5),sx,sy-15);ctx.fillText(p.health,sx,sy+15);});ctx.fillStyle='#4CAF50';ctx.beginPath();ctx.arc(centerX,centerY,8,0,Math.PI*2);ctx.fill();}function updateUI(){if(!player)return;document.getElementById('hp').textContent=`${player.health}/100`;document.getElementById('pos').textContent=`${player.position.x.toFixed(0)},${player.position.y.toFixed(0)}`;document.getElementById('kills').textContent=player.kills;const alive=Array.from(allPlayers.values()).filter(p=>p.status==='alive').length;document.getElementById('alive').textContent=alive;const list=document.getElementById('players');list.innerHTML='';allPlayers.forEach(p=>{const div=document.createElement('div');div.className='player'+(p.status==='dead'?' dead':'');div.innerHTML=`<strong>${p.name}</strong> ${p.health}HP`;list.appendChild(div);});}function gameLoop(){updateMovement();updateUI();render();requestAnimationFrame(gameLoop);}gameLoop();</script></body></html>
